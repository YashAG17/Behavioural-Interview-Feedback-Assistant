<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview History</title><link rel="stylesheet" href="/css/styles.css"></head>
<body><nav class="navbar"><div class="navbar-inner"><a href="/dashboard.html" class="navbar-brand">InterviewIQ</a><a href="/history.html" class="nav-link">History</a><button id="nav-logout-btn" class="btn btn-ghost btn-sm">Log out</button></div></nav><main class="container page"><h1>Interview history</h1><div id="items" class="mt-lg">Loading…</div></main><script src="/js/auth.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{if(!requireAuth())return;updateNavbar();const el=document.getElementById('items');try{const rows=await apiFetch('/interviews/history');if(!rows.length){el.innerHTML='<div class="card">No interviews yet. <a href="/dashboard.html">Start practicing</a>.</div>';return}el.innerHTML=rows.map(s=>`<article class="card mb-md"><h3>${s.role_name}</h3><p>${formatDateTime(s.created_at)} · ${s.question_count} questions · ${modeBadge(s.mode)} ${statusBadge(s.status)}</p><a class="btn btn-primary" href="${s.status==='in_progress'?'/interview.html?session='+s.session_id:s.has_report?'/report.html?session='+s.session_id:'#'}">${s.status==='in_progress'?'Resume':s.has_report?'View report':'Processing'}</a> <button class="btn btn-ghost" onclick="removeSession('${s.session_id}')">Delete</button></article>`).join('')}catch(e){el.textContent=e.message}});async function removeSession(id){if(!confirm('Delete this interview and its report?'))return;await apiFetch('/interviews/'+id,{method:'DELETE'});location.reload()}
</script></body></html>
