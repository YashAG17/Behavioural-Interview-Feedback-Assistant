<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview | InterviewIQ</title><link rel="stylesheet" href="/css/styles.css"><style>.interview-wrap{max-width:850px;margin:3rem auto;padding:0 1rem}.progress-track{height:8px;background:var(--c-border);border-radius:9px;margin:1rem 0 2rem}.progress-fill{height:100%;background:var(--grad-cta);border-radius:9px}.answer-box{width:100%;min-height:220px;resize:vertical}.q-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem}.video-preview{width:100%;max-height:360px;background:#111;border-radius:12px;margin-top:1rem}.hidden{display:none!important}</style></head>
<body><nav class="navbar"><div class="navbar-inner"><a href="/dashboard.html" class="navbar-brand"><span class="brand-name">InterviewIQ</span></a><div class="navbar-actions"><span id="nav-user"></span><button class="btn btn-ghost btn-sm" id="nav-logout-btn">Log Out</button></div></div></nav><main class="interview-wrap"><div id="loading" class="card">Loading your interview…</div><div id="interview" class="hidden"><div class="text-secondary" id="meta"></div><div class="progress-track"><div class="progress-fill" id="progress"></div></div><div class="text-secondary" id="counter"></div><section class="card mt-md"><h2 id="question"></h2><p id="competency" class="text-secondary"></p><textarea class="form-input answer-box" id="answer" aria-label="Your response" placeholder="Describe the situation, your actions, and the outcome…"></textarea><div id="voice-tools" class="mt-md hidden"><button class="btn btn-secondary" id="speak-btn">Start speaking</button> <span id="speech-status" class="text-secondary"></span><p class="text-secondary">Browser speech recognition transcribes your answer. Review it before saving.</p></div><div id="video-tools" class="mt-md hidden"><button class="btn btn-secondary" id="camera-btn">Start camera</button> <button class="btn btn-ghost" id="record-btn" disabled>Start recording</button> <span id="video-status" class="text-secondary"></span><video id="preview" class="video-preview" autoplay muted playsinline></video><p class="text-secondary">Video stays in this browser; its transcript is saved for evaluation.</p></div><div class="q-nav"><button class="btn btn-ghost" id="prev">← Previous</button><span id="save-status" class="text-secondary" aria-live="polite"></span><button class="btn btn-primary" id="next">Save &amp; Next →</button></div></section><div class="text-center mt-lg"><button class="btn btn-primary btn-lg" id="submit">Submit complete interview</button><p class="text-secondary">One report is generated after submission.</p></div></div></main><div id="toast-container" aria-live="polite"></div><script src="/js/auth.js"></script><script>
let session,questions=[],responses={},index=0,recognition=null,stream=null,recorder=null,chunks=[];const sid=new URLSearchParams(location.search).get('session');
document.addEventListener('DOMContentLoaded',async()=>{if(!requireAuth())return;updateNavbar();if(!sid){location.href='/dashboard.html';return}try{[session,questions]=await Promise.all([apiFetch('/interviews/'+sid),apiFetch('/interviews/'+sid+'/questions')]);(await apiFetch('/interviews/'+sid+'/responses')).forEach(r=>responses[r.question_id]=r);if(session.status!=='in_progress'){location.href='/report.html?session='+sid;return}document.getElementById('meta').textContent=session.role_id+' · '+session.mode+' mode';document.getElementById('loading').classList.add('hidden');document.getElementById('interview').classList.remove('hidden');setupMode();render()}catch(e){document.getElementById('loading').textContent=e.message}});
function setupMode(){const mode=session.mode;document.getElementById('voice-tools').classList.toggle('hidden',mode==='text');document.getElementById('video-tools').classList.toggle('hidden',mode!=='video');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;document.getElementById('answer').value=(document.getElementById('answer').dataset.base||'')+t};recognition.onend=()=>{document.getElementById('speech-status').textContent='';document.getElementById('speak-btn').textContent='Start speaking'}}else if(mode!=='text')document.getElementById('speech-status').textContent='Speech recognition is unavailable; type instead.';document.getElementById('speak-btn').onclick=()=>{if(!recognition)return;const b=document.getElementById('speak-btn');if(b.textContent.startsWith('Stop')){recognition.stop();return}document.getElementById('answer').dataset.base=document.getElementById('answer').value+' ';document.getElementById('speech-status').textContent='Listening…';b.textContent='Stop speaking';recognition.start()};document.getElementById('camera-btn').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('preview').srcObject=stream;document.getElementById('record-btn').disabled=false;document.getElementById('video-status').textContent='Camera ready'}catch(e){document.getElementById('video-status').textContent='Camera unavailable: '+e.message}};document.getElementById('record-btn').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();document.getElementById('record-btn').textContent='Start recording';return}chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const v=document.getElementById('preview');v.srcObject=null;v.src=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));v.controls=true;document.getElementById('video-status').textContent='Recording ready (stored in this browser)'};recorder.start();document.getElementById('record-btn').textContent='Stop recording';document.getElementById('video-status').textContent='Recording…'}}
function render(){const q=questions[index];document.getElementById('counter').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('progress').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.text;document.getElementById('competency').textContent=q.competency.replaceAll('_',' ');document.getElementById('answer').value=responses[q.id]?.transcript||responses[q.id]?.text_content||'';document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'Save answer':'Save & Next →';document.getElementById('save-status').textContent=responses[q.id]?'Saved':''}
async function save(){const q=questions[index],value=document.getElementById('answer').value.trim();if(!value)throw new Error('Please enter or dictate an answer before continuing.');await apiFetch(`/interviews/${sid}/responses/${q.id}`,{method:'PUT',body:JSON.stringify({response_type:session.mode,text_content:session.mode==='text'?value:null,transcript:session.mode==='text'?null:value})});responses[q.id]={text_content:session.mode==='text'?value:null,transcript:session.mode==='text'?null:value};document.getElementById('save-status').textContent='Saved'}
document.getElementById('next').onclick=async()=>{try{await save();if(index<questions.length-1){index++;render()}}catch(e){showToast(e.message,'error')}};document.getElementById('prev').onclick=async()=>{if(index){try{await save()}catch(e){}index--;render()}};document.getElementById('submit').onclick=async()=>{try{await save();const missing=questions.filter(q=>!responses[q.id]);if(missing.length){showToast(`Answer all questions first (${missing.length} remaining).`,'error');return}if(!confirm('Submit the complete interview and generate your report?'))return;await apiFetch(`/interviews/${sid}/submit`,{method:'POST'});if(stream)stream.getTracks().forEach(t=>t.stop());location.href='/report.html?session='+sid}catch(e){showToast(e.message,'error')}};
</script></body></html>
